<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.3"/>

  <!-- Glowing Hexagonal Matrix Node -->
  <polygon points="256,106 386,181 386,331 256,406 126,331 126,181" 
           fill="none" stroke="url(#grad1)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Interlocking Evolution Helix / Remix Triangles -->
  <path d="M256 160 L336 300 L176 300 Z" fill="none" stroke="url(#grad1)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 352 L176 212 L336 212 Z" fill="none" stroke="url(#grad2)" stroke-width="8" stroke-linejoin="round" opacity="0.85"/>

  <!-- Center Core Pulsing Matrix Nucleus -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="18" fill="#a855f7"/>

  <!-- Satellite Nodes -->
  <circle cx="256" cy="106" r="14" fill="#38bdf8"/>
  <circle cx="386" cy="181" r="14" fill="#a855f7"/>
  <circle cx="386" cy="331" r="14" fill="#ec4899"/>
  <circle cx="256" cy="406" r="14" fill="#f59e0b"/>
  <circle cx="126" cy="331" r="14" fill="#10b981"/>
  <circle cx="126" cy="181" r="14" fill="#6366f1"/>
</svg>
